<a class="project-card" href="{{ include.project.url }}" target="_blank" rel="noopener">
    <div class="project-thumb">
        {% if include.project.image %}
        <img src="{{ include.project.image | relative_url }}" alt="{{ include.project.title }}">
        {% else %}
        <i class="fa fa-code project-thumb-icon" aria-hidden="true"></i>
        {% endif %}
    </div>
    <h5 class="project-title">{{ include.project.title }}</h5>
    <p class="project-subtitle">{{ include.project.category }}</p>
</a>
